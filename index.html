<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gym Log</title><style>body{margin:0;background:#0f1115;color:#f5f5f5;font-family:system-ui,sans-serif}.wrap{max-width:1050px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:#181c24;border:1px solid #2d3442;border-radius:14px;padding:16px;margin-bottom:14px}.kpi{font-size:30px;font-weight:800}.muted,.note{color:#9ca3af}.progress{height:10px;background:#303746;border-radius:8px;overflow:hidden}.progress span{display:block;height:100%;background:#7dd3fc}.chart{width:100%;height:270px}.session{padding:12px 0;border-top:1px solid #303746}.session:first-child{border-top:0}.sets{line-height:1.6}select{background:#111827;color:#fff;border:1px solid #374151;border-radius:8px;padding:8px}svg text{fill:#9ca3af;font-size:11px}.axis{stroke:#374151}.plot{fill:none;stroke:#7dd3fc;stroke-width:3}.dot{fill:#86efac}</style></head><body><main class="wrap"><h1>Gym Log</h1><p class="muted">FBW strength tracker • bench goal 100 kg</p><section id="stats" class="grid"></section><section class="card"><h2>Bench e1RM</h2><div id="chart" class="chart"></div></section><section class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><h2>Workouts</h2><select id="filter"><option value="all">All exercises</option></select></div><div id="sessions">Loading…</div></section><p class="note">e1RM uses the Epley formula for multi-rep sets. Imported sessions with unknown dates are labeled as historical.</p></main><script src="app.js?v=20260821-1"></script></body></html>
